server {
  listen 80;
  server_name _;
  add_header X-Content-Type-Options nosniff always;
  location = /assessment-quiet.js {
    alias /etc/nginx/assessment-quiet.js;
    default_type application/javascript;
  }
  location = /rest/admin/application-configuration {
    alias /etc/nginx/juice-public-config.json;
    default_type application/json;
  }
  location ~* ^/api/(challenges|challenge-solutions|hints)(/|$) {
    return 404;
  }
  location / {
    proxy_pass http://juice:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '</head>' '<script src="/assessment-quiet.js"></script></head>';
  }
}
